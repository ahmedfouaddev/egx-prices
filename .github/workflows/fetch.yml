name: Fetch EGX prices
on:
  schedule:
    # Every 15 min, 07:00-13:59 UTC, Sun-Thu (covers EGX hours in both Cairo DST and standard time)
    - cron: "*/15 7-13 * * 0-4"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch quotes
        run: python3 fetch_prices.py
      - name: Commit if changed
        run: |
          git config user.name "egx-prices-bot"
          git config user.email "egx-prices-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet && echo "no change" || git commit -m "prices $(date -u +%Y-%m-%dT%H:%MZ)" && git push
